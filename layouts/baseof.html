<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">

<head>
    {{- partial "head.html" . }}
</head>

<body id="top" class="sheet">
    <a class="skip-link" href="#main">Skip to content</a>

    {{ partial "header.html" . -}}
    
    <div class="sheetFrame">
        <main class="main" id="main" tabindex="-1">
            {{ if .IsHome }}
            <div class="office">
                {{ partial "profile.html" . }}
            </div>
            {{ end }}
            {{- block "main" . }}{{ end }}
        </main>
        {{- partial "paperedge.html" . }}
    </div>

    {{ partial "footer.html" . }}
</body>

</html>
